<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de ID Prueba - Astoreca</title>
    <!-- Cargamos la librería SheetJS para leer Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; /* Fondo gris claro para resaltar el centro */
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .app-container {
            max-width: 500px; 
            margin: 20px auto; 
            background-color: #ffffff; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); /* Sombra elegante */
        }
        .header-container {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0; /* Línea separadora */
        }
        .logo {
            max-width: 220px; /* Tamaño ideal para el logo */
            height: auto;
        }
        h2 { 
            text-align: center; 
            color: #1a1a1a; 
            font-size: 22px;
            margin-top: 0;
        }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #555; }
        select { 
            width: 100%; 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #ccc;
            font-size: 15px;
            box-sizing: border-box;
        }
        button { 
            padding: 12px 15px; 
            background-color: #000000; /* Botón negro haciendo juego con el logo */
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold;
            margin-top: 15px; 
            transition: background-color 0.3s;
        }
        button:hover { background-color: #333333; }
        #resultado { 
            margin-top: 25px; 
            padding: 20px; 
            background-color: #f8f9fa; 
            border: 1px solid #e9ecef;
            border-radius: 8px; 
            text-align: center; 
        }
        #textoResultado {
            margin: 0;
            font-size: 16px;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Encabezado con logo -->
        <div class="header-container">
            <img src="logo.png" alt="Logo Astoreca" class="logo">
        </div>

        <h2>Buscador de ID Prueba</h2>

        <div class="control-group">
            <label for="establecimiento">Establecimiento:</label>
            <select id="establecimiento"><option value="">Cargando...</option></select>
        </div>

        <div class="control-group">
            <label for="grado">Grado:</label>
            <select id="grado"><option value="">Cargando...</option></select>
        </div>

        <div class="control-group">
            <label for="letra">Letra:</label>
            <select id="letra"><option value="">Cargando...</option></select>
        </div>

        <div class="control-group">
            <label for="nivel">Nivel / Tipo Evaluación:</label>
            <select id="nivel"><option value="">Cargando...</option></select>
        </div>

        <button onclick="buscarID()">Buscar ID</button>

        <div id="resultado">
            <p id="textoResultado">Selecciona las opciones para ver el ID.</p>
        </div>
    </div>

    <script>
        let datosExcel = [];

        async function cargarExcel() {
            try {
                // Nombre de tu archivo Excel actual
                const response = await fetch('claves_plataforma.xlsx'); 
                
                if (!response.ok) {
                    throw new Error("No se pudo encontrar el archivo.");
                }

                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, {type: 'array'});
                
                const primeraHoja = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[primeraHoja];
                
                datosExcel = XLSX.utils.sheet_to_json(worksheet);
                
                poblarSelectores();
                document.getElementById('textoResultado').innerText = "Base de datos cargada. Selecciona las opciones.";
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('textoResultado').innerHTML = `<span style="color: red;">Error al cargar la base de datos.</span>`;
            }
        }

        function poblarSelectores() {
            const establecimientos = [...new Set(datosExcel.map(item => item['Establecimiento']))].filter(Boolean);
            const grados = [...new Set(datosExcel.map(item => item['Grado']))].filter(Boolean);
            const letras = [...new Set(datosExcel.map(item => item['Letra']))].filter(Boolean);
            const niveles = [...new Set(datosExcel.map(item => item['Nivel / Tipo Evaluación']))].filter(Boolean);

            llenarSelect('establecimiento', establecimientos);
            llenarSelect('grado', grados);
            llenarSelect('letra', letras);
            llenarSelect('nivel', niveles);
        }

        function llenarSelect(idElemento, valores) {
            const select = document.getElementById(idElemento);
            select.innerHTML = '<option value="">Seleccione...</option>';
            valores.forEach(valor => {
                const option = document.createElement('option');
                option.value = valor;
                option.text = valor;
                select.appendChild(option);
            });
        }

        function buscarID() {
            const estSeleccionado = document.getElementById('establecimiento').value;
            const gradoSeleccionado = document.getElementById('grado').value; 
            const letraSeleccionada = document.getElementById('letra').value;
            const nivelSeleccionado = document.getElementById('nivel').value;

            if(!estSeleccionado || !gradoSeleccionado || !letraSeleccionada || !nivelSeleccionado) {
                document.getElementById('textoResultado').innerText = "Por favor, selecciona todos los campos.";
                return;
            }

            const resultado = datosExcel.find(item => 
                String(item['Establecimiento']) === estSeleccionado &&
                String(item['Grado']) === gradoSeleccionado &&
                String(item['Letra']) === letraSeleccionada &&
                String(item['Nivel / Tipo Evaluación']) === nivelSeleccionado
            );

            if (resultado && resultado['ID prueba']) {
                document.getElementById('textoResultado').innerHTML = `El ID de la prueba es:<br><br><strong style="font-size: 36px; color: #000;">${resultado['ID prueba']}</strong>`;
            } else {
                document.getElementById('textoResultado').innerText = "No se encontró un ID para esta combinación.";
            }
        }

        window.onload = cargarExcel;
    </script>
</body>
</html>
